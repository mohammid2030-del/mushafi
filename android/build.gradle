// Each selectable UI language must have the complete three-card guidance.
tasks.register("verifyTranslationGuide") {
 doLast {
  def parser=new groovy.json.JsonSlurper()
  def raw=file("assets/quran-translation-guide-copy.js").getText("UTF-8").split('const QURAN_TRANSLATION_GUIDE=',2)[1].trim().replaceFirst(/;$/, '')
  def data=parser.parseText(raw)
  def declaration=file("assets/i18n.js").readLines("UTF-8").find { it.startsWith('const UI_LANGUAGES=') }
  def languages=[];def matcher=(declaration =~ /\['([a-z]{2})',/);matcher.each { languages.add(it[1]) }
  if(data.version!=1 || data.languages.keySet()!=languages.toSet())throw new GradleException("Incomplete translation guidance languages")
  data.languages.each { language,copy ->
   ['title','next','done','back','close','progress','loading','error','sources'].each { field -> if(!(copy[field] instanceof String)||!copy[field].trim())throw new GradleException("Missing guidance text: "+language+"/"+field) }
   if(copy.steps.size()!=3 || copy.sourceNames.size()!=data.sources.size())throw new GradleException("Incomplete guidance cards")
   copy.steps.each { step -> if(!step.title?.trim()||!step.rule?.trim()||step.paragraphs.size()!=2||step.paragraphs.any{!it?.trim()})throw new GradleException("Incomplete guidance paragraph") }
   if(copy.progress.findAll(/\{\d+\}/).sort()!=['{0}','{1}'])throw new GradleException("Invalid guidance progress placeholders")
  }
  data.sources.each { source -> def uri=new URI(source.url);if(uri.scheme!='https'||!(uri.host in ['binbaz.org.sa','www.diyanet.gov.tr']))throw new GradleException("Untrusted guidance reference") }
 }
}
tasks.matching { it.name in ["assembleRelease", "bundleRelease"] }.configureEach { dependsOn tasks.named("verifyTranslationGuide") }

// Refuse releases with missing editions, changed canonical pages or altered Quran quotations.
tasks.register('verifyStoryEditions') {
    doLast {
        def root = file('assets/stories/hina-saal-alinsan')
        def original = new File(root, 'book.json')
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(original.bytes).encodeHex().toString()
        if (digest != 'c5319ab0c8d1f86c82664f76ad60588fab0989830e7abe8de1dc5032323f5388') throw new GradleException('Canonical story changed')
        def parser = new groovy.json.JsonSlurper()
        def source = parser.parse(original)
        ['en','ur','bn','tr'].each { locale ->
            def edition = parser.parse(new File(root, "book-${locale}.json"))
            if (edition.language != locale || edition.originalSourceSha256 != digest || edition.pages.size() != 60 || edition.page_count != 60) throw new GradleException("Invalid story edition: ${locale}")
            source.pages.eachWithIndex { page, index ->
                def translated = edition.pages[index]
                if (translated.page != page.page || translated.content.split('\\n', -1).length != page.content.split('\\n', -1).length || (translated.content =~ /﴿[^﴾]+﴾/).findAll() != (page.content =~ /﴿[^﴾]+﴾/).findAll() || translated.content.contains('__MUSHAFI_')) throw new GradleException("Invalid story page: ${locale}/${page.page}")
            }
        }
    }
}
tasks.matching { it.name in ['assembleRelease', 'bundleRelease'] }.configureEach { dependsOn tasks.named('verifyStoryEditions') }
