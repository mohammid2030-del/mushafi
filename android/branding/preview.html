<!doctype html><html><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#e9ebe6;font-family:Arial;display:grid;grid-template-columns:1fr 1fr}.panel{height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#f7f5ee;color:#153e31}.panel.dark{background:#101c17;color:#eadbb9}.app-icon{width:210px;height:210px;filter:drop-shadow(0 15px 22px #0001)}.notification{display:flex;align-items:center;justify-content:center;gap:20px;height:45px}.notification img{width:26px;height:26px}.light .notification img{filter:brightness(0)}small{font-size:13px;letter-spacing:2px}h1{font-weight:500;font-size:20px;margin:0}</style><section class="panel light"><small>LIGHT</small><img class="app-icon" src="mushafi-light.svg"><div class="notification"><img src="mushafi-notification.svg"><h1>مصحفي</h1></div></section><section class="panel dark"><small>DARK</small><img class="app-icon" src="mushafi-dark.svg"><div class="notification"><img src="mushafi-notification.svg"><h1>مصحفي</h1></div></section></html>
