const app=document.getElementById('app');let current=0,view='home',size=+(localStorage.fontSize||29);let saved=JSON.parse(localStorage.bookmarks||'[]');if(localStorage.dark==='1')document.body.classList.add('dark');const ar=n=>uiLocale()==='ar'?String(n).replace(/\d/g,x=>'٠١٢٣٤٥٦٧٨٩'[x]):String(n);const norm=s=>s.normalize('NFD').replace(/[\u0610-\u061a\u064b-\u065f\u0670\u06d6-\u06ed]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ـ/g,'');function active(id){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.id===id))}function toggleDark(){document.body.classList.toggle('dark');localStorage.dark=document.body.classList.contains('dark')?'1':'0'}function home(){if(observer)observer.disconnect();view='home';current=0;active('n-home');const last=JSON.parse(localStorage.last||'null');app.innerHTML=`<div class="hero"><div class="eyebrow">القرآن الكريم</div><h1>وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا</h1><p>١١٤ سورة • النص العثماني • متاح دون إنترنت</p>${last?`<button class="primary" onclick="read(${last.c},${last.v})">متابعة القراءة · ${chapters[last.c-1].name_arabic}، آية ${ar(last.v)}</button>`:'<button class="primary" onclick="read(1)">ابدأ بسورة الفاتحة</button>'}</div><input class="search" id="search" placeholder="ابحث باسم السورة أو بكلمات من آية…" aria-label="البحث" oninput="search(this.value)"><div id="list"></div>`;search('');window.scrollTo(0,0)}function search(q){q=norm(q.trim());let found=chapters.filter(c=>norm(c.name_arabic).includes(q)||String(c.id)===q);let html='<div class="section"><strong>فهرس السور</strong><span>'+ar(found.length)+' سورة</span></div>'+found.map(c=>`<button class="row" onclick="read(${c.id})"><span class="num">${ar(c.id)}</span><div class="title">${c.name_arabic}<div class="sub">${c.revelation_place==='makkah'?'مكية':'مدنية'} · ${ar(c.verses_count)} آية</div></div><span class="arrow">‹</span></button>`).join('');if(q.length>=2){const hits=[];for(const c of chapters)for(const v of c.verses)if(norm(v.text_uthmani).includes(q))hits.push({c,v});html+='<div class="section"><strong>نتائج الآيات</strong><span>'+ar(hits.length)+' نتيجة</span></div>'+hits.slice(0,100).map(({c,v})=>`<button class="row" onclick="read(${c.id},${v.verse_key.split(':')[1]})"><div><div class="result">${v.text_uthmani}</div><div class="sub">${c.name_arabic} · ${ar(v.verse_key.split(':')[1])}</div></div></button>`).join('');if(hits.length>100)html+='<p>تظهر أول ١٠٠ نتيجة. أضف كلمات لتحديد البحث.</p>'}document.getElementById('list').innerHTML=html||'<p class="empty">لا توجد نتائج</p>'}let observer;function read(id,verse=1){if(observer)observer.disconnect();view='reader';current=id;active('n-home');const c=chapters[id-1];app.innerHTML=`<div class="reader-title"><div class="eyebrow">سورة رقم ${ar(id)}</div><h1>سورة ${c.name_arabic}</h1><p>${ar(c.verses_count)} آية · ${c.revelation_place==='makkah'?'مكية':'مدنية'}</p></div><div class="tools"><button onclick="home()">فهرس السور</button><button onclick="font(-2)" aria-label="تصغير الخط">أ−</button><button onclick="font(2)" aria-label="تكبير الخط">أ+</button><select aria-label="انتقال إلى آية" onchange="jump(+this.value)">${c.verses.map((v,i)=>`<option value="${i+1}">آية ${ar(i+1)}</option>`).join('')}</select></div><p class="hint">اضغط رقم الآية لحفظ علامة أو إزالتها</p>${id!==1&&id!==9?'<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>':''}<div>${c.verses.map((v,i)=>`<div class="verse ${saved.includes(v.verse_key)?'saved':''}" id="v${i+1}" data-verse="${i+1}" style="font-size:${size}px"><mark>${v.text_uthmani}</mark><button aria-label="حفظ الآية ${i+1}" onclick="bookmark('${v.verse_key}',this)">۝${ar(i+1)}</button></div>`).join('')}</div><div class="tools">${id>1?`<button onclick="read(${id-1})">السورة السابقة</button>`:''}${id<114?`<button onclick="read(${id+1})">السورة التالية</button>`:''}</div>`;localStorage.last=JSON.stringify({c:id,v:verse});window.scrollTo(0,0);setTimeout(()=>{if(verse>1)jump(verse);observer=new IntersectionObserver(entries=>{const e=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.target.offsetTop-b.target.offsetTop)[0];if(e&&current===id)localStorage.last=JSON.stringify({c:id,v:+e.target.dataset.verse})},{rootMargin:'-10% 0px -65% 0px',threshold:0});document.querySelectorAll('.verse').forEach(e=>observer.observe(e))},120)}function jump(n){document.getElementById('v'+n)?.scrollIntoView({behavior:'auto'});localStorage.last=JSON.stringify({c:current,v:n})}function font(d){size=Math.max(22,Math.min(44,size+d));localStorage.fontSize=size;document.querySelectorAll('.verse').forEach(e=>e.style.fontSize=size+'px')}function bookmark(key,button){saved=saved.includes(key)?saved.filter(k=>k!==key):[...saved,key];localStorage.bookmarks=JSON.stringify(saved);button.closest('.verse').classList.toggle('saved',saved.includes(key));toast(saved.includes(key)?'تم حفظ العلامة':'تمت إزالة العلامة')}function toast(t){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),1800)}function bookmarks(){if(observer)observer.disconnect();view='book';current=0;active('n-book');app.innerHTML='<h1>علاماتي</h1><p>آيات حفظتها للعودة إليها</p>'+saved.map(key=>{const [c,v]=key.split(':').map(Number);return `<button class="row" onclick="read(${c},${v})"><div><div class="result">${chapters[c-1].verses[v-1].text_uthmani}</div><div class="sub">${chapters[c-1].name_arabic} · الآية ${ar(v)}</div></div></button>`}).join('')+(!saved.length?'<div class="empty">لم تحفظ علامات بعد.<br>افتح سورة واضغط رقم أي آية لحفظها.</div>':'');window.scrollTo(0,0)}function about(){if(observer)observer.disconnect();view='about';current=0;active('n-about');app.innerHTML='<div class="hero"><div class="eyebrow">مصحفي · ١.٥</div><h1>القرآن الكريم</h1><p>قراءة هادئة، بلا إعلانات، ودون اتصال.</p></div><div class="about"><h2>مصدر النص</h2><p>النص العثماني وأسماء السور من واجهة Quran.com البرمجية. يحتوي التطبيق على ١١٤ سورة و٦٢٣٦ آية. جُلبت البيانات في ٢٤ أكتوبر ٢٠٢٦، مع التحقق من عدد الآيات وتسلسلها في كل سورة.</p><p>هذا تطبيق مستقل وغير تابع رسميًا لـ Quran.com. عرض الآيات متتابع بحسب السور، ولا يحاكي صفحات مصحف المدينة المطبوعة.</p><h2>بياناتك</h2><p>العلامات وآخر موضع والإعدادات محفوظة على جهازك. لا يحتاج التطبيق إلى حساب أو اتصال بالإنترنت، ولا يجمع بياناتك. حذف التطبيق يمسح البيانات المحلية.</p><h2>الاستخدام</h2><p>ابحث باسم السورة أو بكلمات من آية، وغيّر حجم الخط والوضع الليلي. لحفظ علامة اضغط رقم الآية.</p></div>';window.scrollTo(0,0)}function handleBack(){if(view!=='home')home();else toast('أنت في فهرس السور')}
