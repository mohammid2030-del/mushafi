name: Publish APK
# Copies the latest Android test build (private draft) to the public download used by the website.
on:
  workflow_dispatch:
  # Also publishes automatically when a main build whose commit message has [publish-apk] succeeds.
  workflow_run:
    workflows: [Android]
    types: [completed]
permissions:
  contents: write
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && contains(github.event.workflow_run.head_commit.message, '[publish-apk]'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Copy draft APK to the public download
        run: |
          set -e
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q '[.[] | select(.draft and .name == "android-test")][0].assets[0].id')
          [ -n "$ID" ] || { echo "::error::No android-test draft APK found"; exit 1; }
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$ID" > Mushafi.apk
          ls -la Mushafi.apk
          gh release delete android-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          # Update manifest read by the in-app updater through mushafiapp.com/api/app-update.
          SHA=${{ github.event.workflow_run.head_sha || github.sha }}
          gh api "repos/$GITHUB_REPOSITORY/contents/android/build.gradle?ref=$SHA" -q .content | base64 -d > build.gradle
          gh api "repos/$GITHUB_REPOSITORY/contents/android/update-notes.json?ref=$SHA" -q .content 2>/dev/null | base64 -d > notes.json || echo '{}' > notes.json
          python3 - <<'PY'
          import json, re, hashlib, os
          g = open('build.gradle').read()
          code = int(re.search(r"versionCode\s+(\d+)", g).group(1)); name = re.search(r"versionName\s+'([^']+)'", g).group(1)
          data = open('Mushafi.apk', 'rb').read()
          try: notes = json.load(open('notes.json'))
          except Exception: notes = {}
          m = {'packageName': 'com.mushafi.app', 'available': True, 'versionCode': code, 'versionName': name, 'minSdk': 23,
               'url': f'https://mushafiapp.com/download/Mushafi-{name}.apk', 'size': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
          m.update({k: v for k, v in notes.items() if k.startswith('notes') and isinstance(v, list)})
          json.dump(m, open('app-update.json', 'w'), ensure_ascii=False)
          print(json.dumps({k: m[k] for k in ('versionCode', 'versionName', 'size', 'sha256', 'url')}))
          PY
          gh release create android-latest Mushafi.apk app-update.json --repo "$GITHUB_REPOSITORY" --title "Mushafi Android" --notes "Android download for the Mushafi website." --latest=false
