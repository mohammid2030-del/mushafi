name: Wake worker
# Tests the ring relay on every change; deploys it to Cloudflare on demand.
on:
  push:
    branches: [main]
    paths: ['wake-worker/**', '.github/workflows/wake-worker.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the ring relay to Cloudflare and publish its URL'
        type: boolean
        default: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node wake-worker/test/notify-test.mjs
  deploy:
    if: github.event_name == 'push' || inputs.deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Deploy to Cloudflare
        working-directory: wake-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -o pipefail
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SA_JSON; do if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; exit 1; fi; done
          node check-cloudflare.mjs
          npx --yes wrangler@4 deploy | tee "$RUNNER_TEMP/deploy.log"
          printf '%s' "$SA_JSON" | npx --yes wrangler@4 secret put FIREBASE_SERVICE_ACCOUNT
          URL=$(grep -oE 'https://go\.[a-z0-9-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          if [ -z "$URL" ]; then echo "::error::Could not read the worker URL (is a workers.dev subdomain set in Cloudflare?)"; exit 1; fi
          echo "Worker: $URL"
          curl -fsS "$URL/health"
          node publish-endpoint.mjs "$URL"
          curl -fsS "$URL/.well-known/apple-app-site-association" > /dev/null
          for i in $(seq 1 30); do curl -fsS -o /dev/null https://go.mushafiapp.com/health && break; echo "waiting for go.mushafiapp.com ($i)"; sleep 10; done
          curl -fsS https://go.mushafiapp.com/.well-known/apple-app-site-association | head -c 300; echo
          curl -fsS -o /dev/null -w "assetlinks %{http_code}\n" https://go.mushafiapp.com/.well-known/assetlinks.json
          # The relay used to be called mushafi-wake; remove that old copy once (fine if already gone).
          npx --yes wrangler@4 delete --name mushafi-wake --force 2>/dev/null || true
