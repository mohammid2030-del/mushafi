name: Wake worker
# Tests the ring relay on every change; deploys it to Cloudflare on demand.
on:
  push:
    branches: [main]
    paths: ['wake-worker/**', '.github/workflows/wake-worker.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the ring relay to Cloudflare and publish its URL'
        type: boolean
        default: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node wake-worker/test/notify-test.mjs
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Deploy to Cloudflare
        working-directory: wake-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SA_JSON; do if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; exit 1; fi; done
          npx --yes wrangler@3 deploy | tee "$RUNNER_TEMP/deploy.log"
          printf '%s' "$SA_JSON" | npx --yes wrangler@3 secret put FIREBASE_SERVICE_ACCOUNT
          URL=$(grep -oE 'https://mushafi-wake\.[a-z0-9-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          if [ -z "$URL" ]; then echo "::error::Could not read the worker URL (is a workers.dev subdomain set in Cloudflare?)"; exit 1; fi
          echo "Worker: $URL"
          curl -fsS "$URL/health"
          node publish-endpoint.mjs "$URL"
