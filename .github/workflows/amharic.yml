name: Amharic (meanings and font)
# Downloads the Amharic translation of the meanings (am.sadiq) and Noto Sans Ethiopic once,
# and commits them into the app so Amharic works offline like the other languages.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/tools/fetch-amharic.py', '.github/workflows/amharic.yml']
permissions:
  contents: write
concurrency: { group: amharic-assets, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 android/tools/fetch-amharic.py
      - name: Commit
        run: |
          git config user.name "Mushafi bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/assets/quran-amharic-meanings.json android/docs/sources/am.sadiq.json android/assets/fonts/noto-sans-ethiopic.ttf android/assets/fonts/NotoSansEthiopic-OFL.txt
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "Bundle Amharic meanings (am.sadiq) and Noto Sans Ethiopic for offline use"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && exit 0; sleep 5; done; exit 1
