# Builds Mushafi for iPhone/iPad on GitHub's Mac machines — no local Mac needed.
#
# Mac minutes are expensive on private repositories (they count 10× against the free
# allowance), so nothing runs automatically on every push:
#   • Actions → "iOS" → Run workflow → action = testflight  → signed build uploaded to TestFlight
#   • Actions → "iOS" → Run workflow → action = check       → compile check only (no signing)
#   • Pushing a tag like v3.1.32, or pushing to branch ios-release → TestFlight upload
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID           10-character Team ID (developer.apple.com → Membership details)
#   ASC_KEY_ID              App Store Connect API key ID
#   ASC_ISSUER_ID           App Store Connect API issuer ID
#   ASC_KEY_P8_BASE64       the .p8 key file, base64-encoded (see ios/README-AR.md)
name: iOS

on:
  push:
    tags: ["v*"]
    # Pushing to this branch also uploads to TestFlight (handy for automated fixes).
    branches: ["ios-release"]
  workflow_dispatch:
    inputs:
      action:
        description: "testflight = sign and upload · check = compile only"
        type: choice
        options: [testflight, check]
        default: testflight

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  SPM_DIR: ${{ github.workspace }}/.spm

jobs:
  check:
    name: Compile check (simulator, no signing)
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'check'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Swift packages cache
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ hashFiles('ios/project.yml') }}

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          ios/scripts/sync-version.sh
          ios/scripts/configure-firebase.sh
          cd ios && xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/Mushafi.xcodeproj -scheme Mushafi -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          if ! grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log"; then
            grep -n -A6 -E "error:|Could not resolve|because|requires|conflict" "$RUNNER_TEMP/build.log" | head -150 || true
            tail -n 80 "$RUNNER_TEMP/build.log"
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

  testflight:
    name: Archive & upload to TestFlight
    if: (github.event_name == 'workflow_dispatch' && inputs.action == 'testflight') || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/ios-release'
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=0
          for name in DEVELOPMENT_TEAM ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret for $name (see ios/README-AR.md)"; missing=1; fi
          done
          exit $missing

      - name: Swift packages cache
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ hashFiles('ios/project.yml') }}

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: ios/scripts/install-asc-key.sh

      - name: Verify App Store Connect key
        env:
          APP_BUNDLE_ID: com.mohammedasif.mushafi
        run: python3 ios/scripts/check-asc-key.py

      - name: Generate Xcode project
        run: |
          ios/scripts/sync-version.sh
          ios/scripts/configure-firebase.sh
          # Unique, always-increasing build number: <Android versionCode>.<workflow run>
          code="$(perl -ne 'print $1 if /versionCode\s+(\d+)/' android/build.gradle)"
          echo "BUILD_NUMBER=${code}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          cd ios && xcodegen generate

      - name: Archive (cloud-managed signing)
        run: |
          set -o pipefail
          xcodebuild -project ios/Mushafi.xcodeproj -scheme Mushafi -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Mushafi.xcarchive" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -skipPackagePluginValidation -skipMacroValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          if ! grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"; then
            echo "----- archive.log (errors and last lines) -----"
            grep -n -A6 -E "error:|Could not resolve|because|requires|conflict" "$RUNNER_TEMP/archive.log" | head -150 || true
            tail -n 80 "$RUNNER_TEMP/archive.log"
            exit 1
          fi

      - name: Export & upload to App Store Connect
        run: |
          set -o pipefail
          cp ios/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :teamID $DEVELOPMENT_TEAM" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Mushafi.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log"
          grep -q "EXPORT SUCCEEDED\|Upload succeeded\|Uploaded" "$RUNNER_TEMP/export.log"
          echo "Uploaded Mushafi ${MUSHAFI_VERSION_NAME} (${BUILD_NUMBER}). It appears in TestFlight after Apple finishes processing (usually 10–30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore

      - name: Remove API key
        if: always()
        run: rm -f "$ASC_KEY_PATH"
