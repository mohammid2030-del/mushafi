name: Probe
# One-off checks of outside services from a runner with internet access.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
jobs:
  islamhouse:
    runs-on: ubuntu-latest
    steps:
      - name: IslamHouse categories
        run: |
          B=https://api3.islamhouse.com/v3/paV29H2gm56kvLPy
          curl -sS -m 30 "$B/main/get-categories-tree/ar/json" -o tree.json
          python3 -c "
          import json
          t=json.load(open('tree.json'))
          def walk(n,d=0):
              if d>2: return
              print('  '*d, n.get('id'), n.get('title'), len(n.get('sub_categories') or []))
              for c in n.get('sub_categories') or []: walk(c,d+1)
          walk(t)"
          for p in "categories/viewitems/86219/books/ar/showall/json" "categories/viewitems/86219/showall/ar/books/json" "categories/viewitems/86219/books/ar/books/json" "categories/viewitems/86219/showall/ar/showall/json"; do
            echo "== $p"; curl -sS -m 60 "$B/$p" -o o.json
            python3 -c "
          import json
          try:
            d=json.load(open('o.json'))
            if isinstance(d,list):
              import collections; print('list',len(d),collections.Counter(x.get('datatype') for x in d))
            else: print('obj',str(d)[:300])
          except Exception as e: print('not json', open('o.json').read()[:100])"
          done
