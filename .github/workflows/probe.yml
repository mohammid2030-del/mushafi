name: Probe
# One-off checks of outside services from a runner with internet access.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
jobs:
  islamhouse:
    runs-on: ubuntu-latest
    steps:
      - name: IslamHouse categories
        run: |
          B=https://api3.islamhouse.com/v3/paV29H2gm56kvLPy
          for p in "main/get-categories-tree/ar/json" "categories/main-categories/ar/json" "categories/list/ar/json" "categories/viewcat/0/ar/showall/json" "categories/viewcat/692/ar/showall/json" "categories/viewitems/692/books/ar/ar/1/3/json" "categories/viewitems/692/showall/ar/showall/json" "main/sitecontent/ar/ar/json" "main/get-object-categories/books/ar/json"; do
            echo "== $p"; curl -sS -m 30 "$B/$p" | head -c 900; echo
          done
