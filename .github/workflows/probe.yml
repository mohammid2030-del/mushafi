name: Probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          B=https://api3.islamhouse.com/v3/paV29H2gm56kvLPy
          : > urls.txt
          for p in 1 7 40 90; do curl -sS -m 30 "$B/main/books/ar/ar/$p/25/json" | python3 -c "
          import json,sys
          for x in json.load(sys.stdin)['data']:
            for a in x.get('attachments',[]):
              if a.get('extension_type','').lower()=='pdf': print(x['id'], a['url'], a.get('size')); break" >> urls.txt; done
          wc -l urls.txt
          ok=0; full=0; n=0; tot=0
          while read id url size; do n=$((n+1))
            curl -sS -m 60 -r 0-1048575 "$url" -o part.pdf
            if pdftoppm -f 1 -l 1 -scale-to 300 -png part.pdf c >/dev/null 2>&1 && ls c*.png >/dev/null 2>&1; then ok=$((ok+1)); fi; rm -f c*.png
            if [ $n -le 8 ]; then s=$(date +%s%N); curl -sS -m 120 "$url" -o full.pdf; e=$(( ($(date +%s%N)-s)/1000000 )); b=$(stat -c%s full.pdf); tot=$((tot+b)); pdftoppm -f 1 -l 1 -scale-to 300 -png full.pdf f && full=$((full+1)); echo "$id ${b}B ${e}ms"; rm -f f*.png; fi
          done < urls.txt
          echo "first-1MB renders: $ok / $n ; full renders $full/8 ; bytes $tot"
