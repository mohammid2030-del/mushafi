name: Website
# مصحفي public website (site/) → https://mushafiapp.com
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Deploy to Cloudflare
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy | tee "$RUNNER_TEMP/deploy.log"
          OLD=$(grep -oE 'https://app\.[a-z0-9-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          URL=https://mushafiapp.com
          for i in $(seq 1 30); do curl -fsS -o /dev/null "$URL/" && break; echo "waiting for $URL ($i)"; sleep 10; done
          curl -fsS -o /dev/null -w "home %{http_code}\n" "$URL/"
          curl -fsS -o /dev/null -w "www %{http_code} -> %{redirect_url}\n" "https://www.mushafiapp.com/" || true
          curl -sS -o /dev/null -w "old %{http_code} -> %{redirect_url}\n" "$OLD/"
          curl -fsS -o /dev/null -w "privacy %{http_code}\n" "$URL/privacy"
          curl -sS -I "$URL/download/android" | grep -i "^location"; curl -sS -IL "$URL/download/android" | grep -iE "^HTTP|content-length"
