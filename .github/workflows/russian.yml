name: Russian (meanings)
# Downloads the Amharic translation of the meanings (am.sadiq) and Noto Sans Ethiopic once,
# and commits them into the app so Russian works offline like the other languages.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/tools/fetch-russian.py', '.github/workflows/russian.yml']
permissions:
  contents: write
concurrency: { group: russian-assets, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 android/tools/fetch-russian.py
      - name: Commit
        run: |
          git config user.name "Mushafi bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/assets/quran-russian-meanings.json android/docs/sources/ru.kuliev.json
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "Bundle Russian meanings (ru.kuliev) for offline use"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && exit 0; sleep 5; done; exit 1
