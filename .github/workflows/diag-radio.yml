name: diag-radio
on: { push: { branches: [diag-radio] } }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://stream.radiojar.com/0tpy1h0kxtzuv https://stream.radiojar.com/8s5u5tpdtwzuv; do
            loc=$(curl -sS -o /dev/null -w '%{redirect_url}' "$u" --max-time 5); h=${loc/http:/https:}
            echo "=== $h"; curl -sS -o /dev/null -D - "$h" --max-time 6 -w 'bytes=%{size_download}\n' 2>&1 | head -12 || true
            echo "--- https host only"; curl -sS -o /dev/null -D - "https://${loc#http://}" --max-time 3 2>&1 | grep -i "HTTP/\|location\|curl" || true
            echo "--- 60s stability (cleartext follow)"; curl -sS -L -o /dev/null "$u" --max-time 60 -w 'bytes=%{size_download}\n' 2>&1 | tail -2 || true
          done
          echo "--- other https sources"; for s in https://Qurango.net/radio/tarateel https://backup.qurango.net/radio/tarateel; do curl -sS -o /dev/null -D - "$s" --max-time 4 2>&1 | grep -i "HTTP/\|location\|content-type\|curl" ; done; true
