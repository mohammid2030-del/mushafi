name: Ehsan probe
on:
  push:
    branches: [ehsan-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save playwright-core@1.48.2 >/dev/null 2>&1
      - run: node tools/ehsan-probe.mjs || true
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add -f out && git commit -qm "probe output" && git push -q origin HEAD:ehsan-probe-out --force
