name: Ehsan probe
on:
  push:
    branches: [ehsan-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save playwright-core@1.48.2 >/dev/null 2>&1
      - run: node tools/ehsan-probe.mjs || true
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: out/
