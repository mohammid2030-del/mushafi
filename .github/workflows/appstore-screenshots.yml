# Replace the App Store screenshots with the set on the store-assets branch.
name: App Store screenshots
on:
  workflow_dispatch:
    inputs:
      mode: {description: "inspect or upload", type: choice, options: [inspect, upload, dump, metadata], default: inspect}
      new_version: {description: "Create this version if none is editable (e.g. 3.1.60)", required: false, default: ""}
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: store-assets, path: shots}
      - uses: ruby/setup-ruby@v1
        with: {ruby-version: '3.3'}
      - run: gem install fastlane --no-document >/dev/null
      - name: App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: ios/scripts/install-asc-key.sh
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MODE: ${{ inputs.mode }}
          NEW_VERSION: ${{ inputs.new_version }}
        run: ruby tools/asc-screenshots.rb
