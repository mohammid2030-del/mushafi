name: Android

# Builds the Android app on every change so both platforms stay in step.
# The APK is also published as the android-test release.
# The debug APK is attached to the run (Actions → this run → Artifacts) for testing on a phone.
on:
  workflow_dispatch:
  push:
    branches: [main, ios-release]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK 36
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/build.gradle', 'android/settings.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace verifyUiLocales assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Errors
        if: failure()
        run: grep -n -B2 -A8 -E "error:|FAILURE|What went wrong" "$RUNNER_TEMP/build.log" | head -200 || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mushafi-debug-apk
          path: android/gradle-build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # Test APK as a DRAFT release: only the repo owner can see or download it
      # (the repo is public, so nothing is published for everyone).
      - name: Publish test APK (private draft)
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp gradle-build/outputs/apk/debug/*.apk "$RUNNER_TEMP/mushafi-android-test.apk"
          gh release delete android-test --yes --cleanup-tag 2>/dev/null || true
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q '.[] | select(.draft and .name == "android-test") | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create android-test-draft "$RUNNER_TEMP/mushafi-android-test.apk" \
            --draft --title "android-test" \
            --notes "نسخة تجربة من آخر تحديث (${GITHUB_SHA::7}). خاصة، ليست للنشر." \
            --target "$GITHUB_SHA"
